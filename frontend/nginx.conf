server {
    # Unprivileged port: the container runs as the non-root `nginx` user.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application API is served by the FastAPI container (service name, never
    # localhost, because these are separate containers).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Long-lived hashing for fingerprinted assets, no caching for index.html so
    # a new deployment is picked up immediately.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
