# Render blueprint: managed PostgreSQL + the Dockerised FastAPI backend.
#
#   1. Push this repository to GitHub.
#   2. Render dashboard -> New -> Blueprint -> select the repository.
#   3. Set CORS_ORIGINS to the deployed Vercel origin when prompted.
#   4. After the first deploy, run the historical import once from the
#      service's Shell tab (see README "Production data import").
#
# The database is managed PostgreSQL, not a container filesystem, so imported
# history survives every redeploy.
databases:
  - name: windsight-db
    databaseName: windsight
    user: windsight
    plan: free
    region: frankfurt

services:
  - type: web
    name: windsight-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render assigns the listening port itself: PORT (default 10000) is set
      # at runtime and the image's CMD binds to it. Never pin PORT here, and
      # never override the Dockerfile CMD with a hardcoded-port start command.
      # Render injects a postgres:// URL; the app normalises it to psycopg 3.
      - key: DATABASE_URL
        fromDatabase:
          name: windsight-db
          property: connectionString
      # Production refuses to fall back to a local SQLite file when
      # DATABASE_URL is missing.
      - key: ENVIRONMENT
        value: production
      - key: SEED_ON_STARTUP
        value: "true"
      - key: ENABLE_LIVE_FETCH
        value: "true"
      - key: ALLOW_SNAPSHOT_FALLBACK
        value: "true"
      - key: EVAL_START
        value: "2026-01-01"
      - key: EVAL_END
        value: "2026-01-31"
      - key: DECISION_CUTOFF_HOUR
        value: "12"
      - key: DECISION_CUTOFF_MINUTE
        value: "0"
      - key: DECISION_CUTOFF_DAY_OFFSET
        value: "-1"
      # Set to the Vercel production origin, e.g. https://windsight.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Random value generated by Render; enables POST /api/refresh for the
      # operator. Leave unset to keep the endpoint disabled.
      - key: ADMIN_TOKEN
        generateValue: true
